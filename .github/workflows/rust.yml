name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The fast path leans on inode and mtime behavior, which differs by OS.
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tests first so a lint nit never hides a real failure; `if: always()`
      # so one run reports every result instead of one at a time.
      - name: test
        run: cargo test
        if: always()

      - name: fmt
        run: cargo fmt --check
        if: always()

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        if: always()

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
